[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnisight-backend"
version = "0.1.0"
description = "OmniSight data analytics backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pandas>=2.2,<4",
    "google-genai",
    "python-dotenv",
    "package-name>=0.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["omnisight*"]

[tool.fastapi]
entrypoint = "omnisight.main:app"
